packages:
  - apps/*
  - packages/*
  - plugins/*
  - examples/plugins/*
  - e2e/*

publicHoistPattern:
  - "!bun-types"
  - "!@types/bun"

overrides:
  prosemirror-view: "1.41.7"
  lightningcss: "1.30.1"
  protobufjs: "7.6.5"
  seroval: "1.5.3"
  "@xhmikosr/decompress": "10.2.1"
  # 57.0.4 has a Swift type-inference ambiguity in JavaScriptCodable+Date.swift
  # (ambiguous abs() overload) that a stricter Swift compiler (Xcode 26.3) rejects;
  # fixed upstream in 57.0.6 by using .magnitude instead of abs().
  expo-modules-jsi: "57.0.6"

peerDependencyRules:
  allowedVersions:
    motion: "11"
    react: "19"
    "@lobehub/ui": "3.4.0"
    unist-util-visit: "5"
    esbuild: "0.25"

allowBuilds:
  "@infisical/cli": true
  "@parcel/watcher": true
  "@sentry/cli": true
  cbor-extract: true
  core-js: true
  dprint: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  netlify: true
  protobufjs: true
  puppeteer: true
  sharp: true
  supabase: true
  unix-dgram: true
