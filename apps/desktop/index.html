<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mentari</title>
    <script src="/theme-boot.js"></script>
    <style>
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(60 9% 98%);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: hsl(24 10% 11%);
      }
      .boot-splash-mark {
        position: relative;
        width: 4.5rem;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.1));
      }
      html.dark .boot-splash-mark {
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
      }
      .boot-splash-mark img {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        color: hsl(24 10% 10% / 0.75);
        background: url("/assets/mentari-icon.svg") center / contain no-repeat;
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      html.dark .boot-splash-highlight {
        color: hsl(60 9% 98% / 0.5);
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: hsl(25 5% 45%);
        font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: hsl(25 5% 55%);
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <img src="/assets/mentari-icon.svg" alt="" />
          <div class="boot-splash-highlight" aria-hidden="true"></div>
        </div>
        <p class="boot-splash-detail">
          Loading Mentari. This is taking longer than expected.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
